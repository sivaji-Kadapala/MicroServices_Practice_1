#          http://localhost:3333/Greet
#          http://localhost:3333/welcome
spring:
  application:
    name: 06_API_Gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: api-1
          uri: lb://04-Welcome-API
          predicates:
            - Path=/welcome  # ✅ Corrected (capital 'P')
        - id: api-2
          uri: lb://05-Greet-API
          predicates:
            - Path=/Greet  # ✅ Corrected (capital 'P')
server:
  port: 3333
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
